name: "✨ 기능 추가 / 개선 요청"
description: "새로운 기능 제안이나 기존 기능의 개선 아이디어를 제안합니다."
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        배스샷(BassShot)을 더 멋진 앱으로 만들기 위한 제안을 환영합니다!  
        제안하고 싶은 기능에 대해 자유롭게 설명해주세요.

  - type: textarea
    id: feature-summary
    attributes:
      label: 💡 제안 기능 요약
      description: 추가하거나 개선하고 싶은 기능의 핵심을 요약해주세요.
      placeholder: 예) 어종 선택 기능 추가 (배스 외 쏘가리, 꺽지, 가물치 등)
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 🧐 제안 배경 및 필요성
      description: 왜 이 기능이 필요한가요? 현재 어떤 불편함이 있거나 필요성이 생겼는지 알려주세요.
      placeholder: 예) 배스 외에 다른 루어 대상어도 계측하고 싶은 사용자 요구가 있습니다.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 📝 상세 내용 및 구현 아이디어
      description: 구체적으로 어떤 방식으로 동작하면 좋을지, 구상하신 UI나 기능 흐름을 작성해주세요.
      placeholder: 예) 카메라 프리뷰 상단에 대상어 선택 드롭다운을 추가하고...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 대안 및 고려한 방법
      description: 생각해보신 다른 대안이나 우회 방법이 있다면 작성해주세요.

  - type: textarea
    id: references
    attributes:
      label: 🎨 참고 자료 / UI 레퍼런스
      description: 참고할 만한 이미지, 스케치, 링크 등이 있다면 첨부해주세요.

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 참고 사항
      description: 기타 논의하고 싶은 내용이나 추가 메모가 있다면 자유롭게 작성해주세요.
